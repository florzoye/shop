stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - shop-server
  script:
    - echo "🚀 Starting deployment..."
    - cd /root/shop
    - docker-compose down || true
    - docker-compose build
    - docker-compose up -d
    - echo "✅ Deployment completed!"
  only:
    - main
  when: manual