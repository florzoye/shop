stages:
  - deploy

variables:
  PROJECT_DIR: "/root/shop"

.deploy_template: &deploy_template
  tags:
    - shop-server
  before_script:
    - cd $PROJECT_DIR
    - echo "📦 Docker version: $(docker --version)"
    - echo "📦 Docker Compose version: $(docker-compose --version)"
  after_script:
    - echo "✅ Job completed at $(date)"

deploy_production:
  <<: *deploy_template
  stage: deploy
  script:
    - |
      set -ex
      echo "🚀 Starting production deployment..."
      
      # Backup database
      if [ -f "data/products.db" ]; then
        echo "💾 Creating backup..."
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        mkdir -p backups
        cp data/products.db backups/products_backup_${TIMESTAMP}.db
        echo "Backup: backups/products_backup_${TIMESTAMP}.db"
        
        # Keep last 5 backups
        (ls -t backups/products_backup_*.db 2>/dev/null | head -5; ls backups/products_backup_*.db 2>/dev/null) | sort | uniq -u | xargs -r rm -f
      fi
      
      # Pull latest code
      echo "📥 Pulling changes..."
      git fetch origin
      git reset --hard origin/main
      
      # Stop and rebuild
      echo "🛑 Stopping containers..."
      docker-compose down || true
      
      echo "🏗️ Building..."
      docker-compose build --no-cache
      
      echo "🚀 Starting..."
      docker-compose up -d
      
      # Wait and check
      echo "⏳ Waiting for startup..."
      sleep 15
      
      # Cleanup
      echo "🧹 Cleaning up old images..."
      docker image prune -f
      
      # Verify
      echo "📊 Checking container..."
      docker-compose ps
      echo "📝 Recent logs:"
      docker-compose logs --tail=10 bot
      
      echo "✅ Deployment successful!"
  only:
    - main
  when: manual
  environment:
    name: production

deploy_auto:
  <<: *deploy_template
  stage: deploy
  script:
    - |
      set -ex
      echo "⚡ Auto-deploy to staging..."
      
      git fetch origin
      git reset --hard origin/develop || git reset --hard origin/main
      
      docker-compose down
      docker-compose build
      docker-compose up -d
      
      sleep 10
      docker-compose ps
  only:
    - develop
  when: always